name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Generate · Test · Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Installs Tuist pinned in .mise.toml
      - uses: jdx/mise-action@v2

      # Secrets are local-only; CI uses the committed template (no real keys needed for mock backend).
      - name: Bootstrap local secrets file
        run: cp XCConfigs/Sensitive.xcconfig.example XCConfigs/Sensitive.xcconfig

      - name: Resolve SPM dependencies
        run: mise exec -- tuist install

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      # Pick an iPhone simulator that actually exists on this runner image (don't hardcode a name).
      - name: Resolve simulator
        run: |
          echo "── available simulators ──"
          xcrun simctl list devices available
          UDID=$(xcrun simctl list --json devices available | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          iphones = [dev for rt, devs in d.items() if 'iOS' in rt
                     for dev in devs if dev['name'].startswith('iPhone')]
          print(iphones[-1]['udid'] if iphones else '')
          ")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Test (Domain)
        run: |
          xcodebuild test \
            -workspace TRACE.xcworkspace \
            -scheme Domain \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (TraceApp)
        run: |
          xcodebuild build \
            -workspace TRACE.xcworkspace \
            -scheme TraceApp \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -quiet CODE_SIGNING_ALLOWED=NO
