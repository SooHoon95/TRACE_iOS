name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Generate · Test · Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Installs Tuist pinned in .mise.toml
      - uses: jdx/mise-action@v2

      # Secrets are local-only; CI uses the committed template (no real keys needed for mock backend).
      - name: Bootstrap local secrets file
        run: cp XCConfigs/Sensitive.xcconfig.example XCConfigs/Sensitive.xcconfig

      - name: Resolve SPM dependencies
        run: mise exec -- tuist install

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      # NOTE: destination sim must exist on the runner image; adjust if the image changes.
      - name: Test (Domain)
        run: |
          xcodebuild test \
            -workspace TRACE.xcworkspace \
            -scheme Domain \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet CODE_SIGNING_ALLOWED=NO

      - name: Build (TraceApp)
        run: |
          xcodebuild build \
            -workspace TRACE.xcworkspace \
            -scheme TraceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet CODE_SIGNING_ALLOWED=NO
