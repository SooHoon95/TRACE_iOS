# Local/OCI stack: FastAPI + Postgres. On OCI, run `docker compose up -d` on an
# Always-Free Arm (Ampere A1) instance. Photos persist in a named volume (or set
# STORAGE_BACKEND=oci to use Object Storage).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: trace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://trace:${POSTGRES_PASSWORD:-trace}@db:5432/trace
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.efreedom.trace}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - photos:/app/_photos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  photos:
